name: AI Auto-Tune — Amélioration Continue

on:
  schedule:
    - cron: '0 6 * * *'      # UX audit + bug scan — chaque jour à 6h UTC
    - cron: '0 */6 * * *'    # Veille news AI/LLM/IoT — toutes les 6h (quota GitHub gratuit)
    - cron: '0 9 * * 1'      # Feature planning hebdomadaire — lundi 9h UTC
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

jobs:

  # ─────────────────────────────────────────────
  # JOB 1 : Veille technologique & enrichissement du contenu
  # ─────────────────────────────────────────────
  news-watcher:
    name: "📡 Veille AI/LLM/IoT"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Fetch & classify news
        run: node scripts/newsWatcher.js
        env:
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
      - name: Commit nouvelles données si changement
        run: |
          git config --global user.name "AI Auto-Tune Bot"
          git config --global user.email "bot@ai-auto-tune.local"
          echo "=== Git status before add ==="
          git status
          git add data/news.json data/trending_topics.json
          echo "=== Git status after add ==="
          git status
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            echo "=== Committing changes ==="
            git commit -m "chore(news): veille auto $(date +'%Y-%m-%d %H:%M') [skip ci]"
            echo "=== Pushing ==="
            git push
            echo "=== Push successful ==="
          fi

  # ─────────────────────────────────────────────
  # JOB 2 : Audit UX, accessibilité, performance
  # ─────────────────────────────────────────────
  ux-audit:
    name: "🔍 Audit UX & Perf"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Build Next.js
        run: npm run build
        continue-on-error: true
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: 'https://nous-daily.vercel.app/'
          uploadArtifacts: true
          temporaryPublicStorage: true
      - name: Analyse LLM des résultats Lighthouse
        run: node scripts/uxAnalyzer.js
        env:
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
      - name: Mise à jour changelog AI Auto-Tune
        run: node scripts/updateChangelog.js --type=ux-audit

  # ─────────────────────────────────────────────
  # JOB 3 : Détection et correction automatique de bugs
  # ─────────────────────────────────────────────
  bug-fixer:
    name: "🐛 Scan & Fix Bugs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: ESLint scan
        run: npx eslint . --format json -o reports/eslint-report.json || true
      - name: TypeScript check
        run: npx tsc --noEmit --pretty > reports/tsc-report.txt 2>&1 || true
      - name: Analyse LLM + auto-patch
        run: node scripts/bugFixer.js
        env:
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
      - name: Commit corrections si existantes
        run: |
          git config --global user.name "AI Auto-Tune Bot"
          git config --global user.email "bot@ai-auto-tune.local"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix(auto): corrections automatiques $(date +'%Y-%m-%d') [auto-tune]"
            git push
            node scripts/updateChangelog.js --type=bug-fix
          fi

  # ─────────────────────────────────────────────
  # JOB 4 : Génération de cas de tests
  # ─────────────────────────────────────────────
  test-generator:
    name: "🧪 Génération Cas de Tests"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Analyser les fichiers modifiés récemment
        run: |
          mkdir -p reports
          # Try multiple git diff strategies for shallow clones
          if git diff --name-only HEAD~5 HEAD > reports/changed-files.txt 2>/dev/null; then
            echo "Used HEAD~5"
          elif git diff --name-only HEAD^ HEAD > reports/changed-files.txt 2>/dev/null; then
            echo "Used HEAD^"
          elif git diff --name-only HEAD~1 HEAD > reports/changed-files.txt 2>/dev/null; then
            echo "Used HEAD~1"
          else
            echo "No git diff available, creating empty file"
            touch reports/changed-files.txt
          fi
      - name: Générer cas de tests via LLM
        run: node scripts/testGenerator.js
        env:
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
      - name: Commit nouveaux tests
        run: |
          git config --global user.name "AI Auto-Tune Bot"
          git config --global user.email "bot@ai-auto-tune.local"
          git add tests/
          if ! git diff --staged --quiet; then
            git commit -m "test(auto): nouveaux cas de tests générés $(date +'%Y-%m-%d') [auto-tune]"
            git push
            node scripts/updateChangelog.js --type=test-generation
          else
            echo "No new tests to commit"
          fi

  # ─────────────────────────────────────────────
  # JOB 5 : Feature planning hebdomadaire
  # ─────────────────────────────────────────────
  feature-planner:
    name: "🚀 Feature Planning Hebdo"
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 9 * * 1' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Analyser tendances marché + user feedback
        run: node scripts/featurePlanner.js
        env:
          LLM_API_KEY: ${{ env.LLM_API_KEY }}
      - name: Créer GitHub Issues pour les features prioritaires
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const features = JSON.parse(fs.readFileSync('reports/planned-features.json', 'utf8'));
              for (const feature of features.slice(0, 3)) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: `[AI-FEATURE] ${feature.title}`,
                  body: feature.description,
                  labels: ['ai-suggested', 'enhancement']
                });
              }
            } catch (e) {
              console.log('No features to create issues for:', e.message);
            }
      - name: Update changelog
        run: node scripts/updateChangelog.js --type=feature-planning

