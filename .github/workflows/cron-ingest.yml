name: Cron — Ingestion des actualités

on:
  schedule:
    - cron: '7 */3 * * *' # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cron-content
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Ingestion des flux RSS
        run: npm run cron:ingest
      - name: Commit des nouveaux articles
        run: |
          if git diff --quiet -- content/ingested.json; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "nous-news-bot"
          git config user.email "nous-news-bot@users.noreply.github.com"
          git add content/ingested.json
          git commit -m "chore(content): veille automatique $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin main
          git push origin HEAD:main
