name: Cron — Surveillance du site

on:
  schedule:
    - cron: '*/30 * * * *' # toutes les 30 minutes
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  SITE_URL: ${{ vars.SITE_URL || 'https://nous-daily.vercel.app' }}

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contrôles de disponibilité
        id: check
        run: |
          set -u
          fail=0
          check() { # $1 chemin  $2 motif attendu dans le corps
            code=$(curl -s -m 20 -o body.txt -w '%{http_code}' "$SITE_URL$1" || echo 000)
            if [ "$code" != "200" ] || ! grep -q "$2" body.txt; then
              echo "KO $1 (HTTP $code)" | tee -a report.txt; fail=1
            else
              echo "OK $1"
            fi
          }
          check /api/health '"status":"ok"'
          check / 'Nous AI News'
          check /api/articles '"items"'
          check /topics 'Thématiques'
          check /feed.xml '<rss'
          echo "fail=$fail" >> "$GITHUB_OUTPUT"
      - name: Ouvrir ou commenter une issue en cas d'échec
        if: steps.check.outputs.fail == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🚨 Site indisponible ou dégradé"
          body=$(printf 'Contrôle automatique en échec (%s).\n\n```\n%s\n```\n\nRun : %s/%s/actions/runs/%s' "$(date -u +'%F %T') UTC" "$(cat report.txt)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug
          fi
      - name: Échec du job si le site est KO
        if: steps.check.outputs.fail == '1'
        run: exit 1
