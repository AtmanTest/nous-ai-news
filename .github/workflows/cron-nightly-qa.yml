name: Cron — QA nocturne

on:
  schedule:
    - cron: '17 2 * * *' # chaque nuit à 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Suite complète (statique, unitaire, API, E2E)
        run: npm run lint && npm run typecheck && npm run test:unit:cov && npm run qa:trace && npx playwright test
      - name: Audit des dépendances (production)
        if: always()
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-reports
          path: |
            playwright-report
            test-results
            coverage
          retention-days: 14
      - name: Ouvrir une issue si la nuit est rouge
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="🔴 QA nocturne en échec"
          body="La suite nocturne a échoué : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" --json number -q '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body" --label bug; fi
