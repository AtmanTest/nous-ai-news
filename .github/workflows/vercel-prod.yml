name: Vercel Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'

jobs:
  deploy:
    name: Deploy daily-ai to Vercel production
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TNR unit/regression tests
        run: npm run tnr

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Link Vercel project
        run: npx vercel link --yes --project daily-ai --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel production environment
        run: npx vercel pull --yes --environment=production --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build prebuilt artifact
        run: npx vercel build --prod --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        run: npx vercel deploy --prebuilt --prod --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: P0 dashboard smoke tests on production
        env:
          E2E_BASE_URL: https://nous-daily.vercel.app
        run: npm run test:e2e:smoke
