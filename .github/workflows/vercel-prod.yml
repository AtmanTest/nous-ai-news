name: Vercel Production Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'tests/test-cases/**'
      - '*.md'

jobs:
  deploy:
    name: Deploy daily-ai to Vercel production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Link Vercel project
        run: npx vercel link --yes --project daily-ai --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel production environment
        run: npx vercel pull --yes --environment=production --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build prebuilt artifact
        run: npx vercel build --prod --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt artifact to production
        run: npx vercel deploy --prebuilt --prod --scope tazou-s-projects --token=${{ secrets.VERCEL_TOKEN }}
