name: Cron — Contrôle des liens sources

on:
  schedule:
    - cron: '23 4 * * *' # chaque jour à 04:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cron-content
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Vérifier les liens (retire les 404/410)
        run: npm run cron:links
      - name: Commit des suppressions
        run: |
          if git diff --quiet -- content/ingested.json; then
            echo "Aucun lien mort."
            exit 0
          fi
          git config user.name "nous-news-bot"
          git config user.email "nous-news-bot@users.noreply.github.com"
          git add content/ingested.json
          git commit -m "chore(content): retrait des liens morts"
          git pull --rebase origin main
          git push origin HEAD:main
